[project]
name = "nantex"
version = "0.1.0"
description = "LaTeX-to-PDF CLI with browser live preview — no local LaTeX install needed"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.3.1",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "typer>=0.25.1",
    "watchdog>=6.0.0",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

[project.urls]
Homepage = "https://github.com/Forge41/nantex"
Repository = "https://github.com/Forge41/nantex"

[project.scripts]
nantex = "nantex.cli:app"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
